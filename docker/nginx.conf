map "$request_uri:$status" $seo_x_robots_tag {
  default "";
  ~^/service-admin(?:[/?]|:) "noindex, nofollow";
  ~^/(?:api|s3)(?:[/?]|:) "noindex, nofollow";
  ~^/(?:app|login|auth|onboarding)/?(?:\?|:) "noindex, nofollow";
  ~:404$ "noindex, nofollow";
}

# Cache only successful, content-hashed build assets for a year. An asset 404
# must not become immutable, so the response status is part of this map key.
map "$request_uri:$status" $seo_cache_control {
  default "no-store";
  ~^/api/ "";
  ~^/s3/ "";
  ~^/assets/.+:(?:200|206|304)$ "public, max-age=31536000, immutable";
  ~^/:(?:200|304)$ "no-cache";
  ~^/(?:pricing|docs|website-support-chat|ai-support-bot|support-sla|helpdesk-small-business|helpdesk-migration|omnichannel-support|customer-support-platform)/:(?:200|304)$ "no-cache";
  ~^/(?:robots\.txt|sitemap\.xml):(?:200|304)$ "public, max-age=300, must-revalidate";
  ~^/service-admin(?:/|$) "no-cache";
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;

  # Docker replaces a service IP on container recreation; resolve it per request.
  resolver 127.0.0.11 ipv6=off valid=10s;

  root /usr/share/nginx/html;
  index index.html;

  # React still uses dynamic style attributes, so style-src temporarily keeps
  # unsafe-inline. Scripts remain strict: no inline code and no eval.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://mc.yandex.ru https://yastatic.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mc.yandex.ru https://cdn.simpleicons.org https://max.ru; font-src 'self' data:; connect-src 'self' https://mc.yandex.ru ws: wss:; manifest-src 'self'; worker-src 'self' blob:;" always;
  add_header X-Robots-Tag $seo_x_robots_tag always;
  add_header Cache-Control $seo_cache_control always;

  error_page 404 /404.html;

  # Canonical public URLs. Build-time prerendering creates one HTML document
  # for each route, and a missing document is a deployment error, not an SPA
  # fallback to the landing page.
  location = / {
    try_files /index.html =404;
  }

  location = /pricing/ {
    try_files /pricing/index.html =404;
  }

  location = /docs/ {
    try_files /docs/index.html =404;
  }

  location = /legal/ {
    try_files /legal/index.html =404;
  }

  location = /website-support-chat/ {
    try_files /website-support-chat/index.html =404;
  }

  location = /ai-support-bot/ {
    try_files /ai-support-bot/index.html =404;
  }

  location = /support-sla/ {
    try_files /support-sla/index.html =404;
  }

  location = /helpdesk-small-business/ {
    try_files /helpdesk-small-business/index.html =404;
  }

  location = /helpdesk-migration/ {
    try_files /helpdesk-migration/index.html =404;
  }

  location = /omnichannel-support/ {
    try_files /omnichannel-support/index.html =404;
  }

  location = /customer-support-platform/ {
    try_files /customer-support-platform/index.html =404;
  }

  # Canonicalize public paths with one permanent redirect.
  location = /landing { return 308 /; }
  location = /landing/ { return 308 /; }
  location = /index.html { return 308 /; }
  location = /pricing { return 308 /pricing/; }
  location = /pricing/index.html { return 308 /pricing/; }
  location = /docs { return 308 /docs/; }
  location = /docs/index.html { return 308 /docs/; }
  location = /legal { return 308 /legal/; }
  location = /legal/index.html { return 308 /legal/; }
  location = /website-support-chat { return 308 /website-support-chat/; }
  location = /website-support-chat/index.html { return 308 /website-support-chat/; }
  location = /ai-support-bot { return 308 /ai-support-bot/; }
  location = /ai-support-bot/index.html { return 308 /ai-support-bot/; }
  location = /support-sla { return 308 /support-sla/; }
  location = /support-sla/index.html { return 308 /support-sla/; }
  location = /helpdesk-small-business { return 308 /helpdesk-small-business/; }
  location = /helpdesk-small-business/index.html { return 308 /helpdesk-small-business/; }
  location = /helpdesk-migration { return 308 /helpdesk-migration/; }
  location = /helpdesk-migration/index.html { return 308 /helpdesk-migration/; }
  location = /omnichannel-support { return 308 /omnichannel-support/; }
  location = /omnichannel-support/index.html { return 308 /omnichannel-support/; }
  location = /customer-support-platform { return 308 /customer-support-platform/; }
  location = /customer-support-platform/index.html { return 308 /customer-support-platform/; }

  # Private product routes remain hash-based during the public SEO migration.
  location = /app { return 308 "/#/app"; }
  location = /app/ { return 308 "/#/app"; }
  location = /login { return 308 "/#/login"; }
  location = /login/ { return 308 "/#/login"; }
  location = /auth { return 308 "/#/login"; }
  location = /auth/ { return 308 "/#/login"; }
  location = /onboarding { return 308 "/#/onboarding"; }
  location = /onboarding/ { return 308 "/#/onboarding"; }

  # Robots and sitemap are files with strict content types; neither may fall
  # through to an HTML document.
  location = /robots.txt {
    default_type text/plain;
    try_files /robots.txt =404;
  }

  location = /sitemap.xml {
    default_type application/xml;
    try_files /sitemap.xml =404;
  }

  # Vite build assets are content-hashed. Missing assets must remain a real 404.
  location ^~ /assets/ {
    try_files $uri =404;
  }

  location = /api/v1/realtime/events/stream {
    set $api_gateway_upstream api-gateway:4100;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Accel-Buffering no;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://$api_gateway_upstream$request_uri;
  }

  location /api/ {
    set $api_gateway_upstream api-gateway:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://$api_gateway_upstream$request_uri;
  }

  # Same-origin загрузка файлов в minio: браузер шлёт подписанный PUT на
  # /s3/<bucket>/<key>?X-Amz-…, nginx снимает префикс и проксирует в minio.
  # Прямой PUT на kubernetes.docker.internal:19000 не работал: его блокирует
  # наш же CSP (connect-src 'self'), а с чужих устройств ещё и DNS/фаервол.
  # Host обязан совпадать с хостом, которым api-gateway ПОДПИСАЛ URL
  # (S3_ENDPOINT гейтвея в docker-compose.yml) — иначе SignatureDoesNotMatch.
  location /s3/ {
    set $minio_upstream minio:9000;
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host "minio:9000";
    rewrite ^/s3/(.*)$ /$1 break;
    proxy_pass http://$minio_upstream;
  }

  # Independent service-admin MPA entry (path routing). Keep the prefix
  # boundary explicit so /service-admin-typo remains a real 404.
  location = /service-admin {
    try_files /service-admin/index.html =404;
  }

  location ^~ /service-admin/ {
    try_files $uri $uri/ /service-admin/index.html;
  }

  # Other real root files (icons, manifest, service workers) may be served, but
  # there is deliberately no catch-all /index.html fallback.
  location / {
    try_files $uri $uri/ =404;
  }

  location = /404.html {
    internal;
    try_files /404.html =404;
  }
}
